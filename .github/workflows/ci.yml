# .github/workflows/deploy.yml
# WHY this pipeline structure:
# Job 1 (detect-changes): Don't rebuild services that haven't changed.
#   Without this: every push rebuilds all 4 services (4× Maven + 4× Docker).
#   With this: only the changed service rebuilds.
#   On a team making 20 commits/day, this saves 6-8 hours of CI time daily.
# Job 2 (build-and-test): Maven build + unit tests with H2 (no Docker needed in CI).
# Job 3 (integration-test): Real PostgreSQL service container — tests actual DB queries.
# Job 4 (security-scan): Trivy (container CVEs) + Gitleaks (secrets). Blocks on CRITICAL.
# Job 5 (push): Build multi-arch Docker image, push to ECR, update Helm values.
# Job 6 (deploy-staging): ArgoCD sync to staging. Prod deploy is separate (PR-gated).

name: EstateFlow AI — CI/CD Pipeline

on:
  push:
    branches: [main, develop, 'feature/**', 'fix/**']
  pull_request:
    branches: [main, develop]

# WHY these env vars at workflow level:
# Avoids repetition in every job. One place to update when cluster changes.
env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: 371056712467.dkr.ecr.ap-south-1.amazonaws.com
  EKS_CLUSTER: compose-portal-eks
  ARGOCD_SERVER: argocd.compose-portal-eks.local

# WHY permissions block:
# GitHub Actions defaults to read-only permissions since 2023.
# id-token: write → required for OIDC JWT token generation (AWS auth)
# contents: write → required to commit updated Helm image tags back to repo
# pull-requests: write → required to post deployment status comments on PRs
permissions:
  id-token: write
  contents: write
  pull-requests: write
  security-events: write   # Required for GitHub Advanced Security SARIF upload

jobs:
  # ─────────────────────────────────────────────────────────────────
  # JOB 1: Detect which services changed (smart matrix build)
  # ─────────────────────────────────────────────────────────────────
  detect-changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build-matrix.outputs.matrix }}
      frontend-changed: ${{ steps.changes.outputs.frontend }}
      infra-changed: ${{ steps.changes.outputs.infra }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2   # Need HEAD and HEAD~1 to diff

      - name: Detect changed paths
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            gateway-service:
              - 'services/gateway-service/**'
            user-service:
              - 'services/user-service/**'
            product-service:
              - 'services/product-service/**'
            order-service:
              - 'services/order-service/**'
            frontend:
              - 'estateflow-ui/**'
            infra:
              - 'k8s/**'
              - 'terraform/**'
              - '.github/workflows/**'

      - name: Build service matrix
        id: build-matrix
        run: |
          SERVICES=()
          # WHY check each service individually:
          # dorny/paths-filter returns 'true'/'false' per filter.
          # We build a JSON array of only the changed services for the build matrix.
          [[ "${{ steps.changes.outputs.gateway-service }}" == "true" ]] && SERVICES+=("gateway-service")
          [[ "${{ steps.changes.outputs.user-service }}" == "true" ]] && SERVICES+=("user-service")
          [[ "${{ steps.changes.outputs.product-service }}" == "true" ]] && SERVICES+=("product-service")
          [[ "${{ steps.changes.outputs.order-service }}" == "true" ]] && SERVICES+=("order-service")

          # If infra changed or no specific service detected, rebuild all
          if [[ "${{ steps.changes.outputs.infra }}" == "true" ]] || [[ ${#SERVICES[@]} -eq 0 ]]; then
            SERVICES=("gateway-service" "user-service" "product-service" "order-service")
          fi

          # Build JSON matrix: {"include":[{"service":"user-service","port":"8081"},...]}
          MATRIX_JSON='{"include":['
          FIRST=true
          for svc in "${SERVICES[@]}"; do
            case $svc in
              gateway-service) PORT=8080 ;;
              user-service)    PORT=8081 ;;
              product-service) PORT=8082 ;;
              order-service)   PORT=8083 ;;
            esac
            [[ $FIRST == false ]] && MATRIX_JSON+=','
            MATRIX_JSON+="{\"service\":\"${svc}\",\"port\":\"${PORT}\"}"
            FIRST=false
          done
          MATRIX_JSON+=']}'
          echo "matrix=${MATRIX_JSON}" >> $GITHUB_OUTPUT
          echo "Services to build: ${SERVICES[*]}"

  # ─────────────────────────────────────────────────────────────────
  # JOB 2: Maven Build + Unit Tests
  # ─────────────────────────────────────────────────────────────────
  build-and-test:
    name: Build & Test — ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.matrix != '{"include":[]}'
    strategy:
      matrix: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
      fail-fast: false   # WHY: Don't cancel other services if one fails. Faster feedback.

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven   # WHY: Caches ~/.m2/repository between runs. Saves 3-4 min/run.

      - name: Secret scan (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # WHY Gitleaks before build:
        # If a developer accidentally commits an AWS key or DB password,
        # this catches it before the code reaches any environment.
        # Gitleaks scans: git history, not just the latest commit.
        # A secret committed and then "deleted" in the next commit is still leaked.
        # Gitleaks finds it in git history.

      - name: Build + unit tests (H2 in-memory DB)
        working-directory: services/${{ matrix.service }}
        run: |
          # WHY -T 1C: Parallelizes Maven build using 1 thread per CPU core.
          # On GitHub Actions 2-core runner: 2 threads. Saves ~90s per service.
          # WHY H2 profile for CI: No PostgreSQL container needed in this job.
          # H2 in-memory DB spins up inside the JVM — zero setup, zero cleanup.
          # Real PostgreSQL tests happen in the integration-test job.
          mvn clean package -T 1C \
            -P ci \
            -Dspring.profiles.active=test \
            -Dmaven.test.failure.ignore=false \
            --no-transfer-progress

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: jar-${{ matrix.service }}-${{ github.sha }}
          path: services/${{ matrix.service }}/target/*.jar
          retention-days: 1   # WHY 1 day: JARs are large. Only needed for this pipeline run.

      - name: Upload test results
        if: always()   # WHY always(): Upload test results even if tests fail (so you can see what failed)
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.service }}
          path: services/${{ matrix.service }}/target/surefire-reports/

  # ─────────────────────────────────────────────────────────────────
  # JOB 3: Integration Tests (Real PostgreSQL)
  # ─────────────────────────────────────────────────────────────────
  integration-test:
    name: Integration Tests — ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [detect-changes, build-and-test]
    strategy:
      matrix: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
      fail-fast: false

    # WHY services block:
    # GitHub Actions can run Docker containers as "services" alongside the job.
    # These services start before steps run and are accessible via localhost.
    # This is faster and simpler than docker-compose in CI.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: testdb
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Download JAR
        uses: actions/download-artifact@v4
        with:
          name: jar-${{ matrix.service }}-${{ github.sha }}
          path: services/${{ matrix.service }}/target/

      - name: Run integration tests
        working-directory: services/${{ matrix.service }}
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/testdb
          SPRING_DATASOURCE_USERNAME: testuser
          SPRING_DATASOURCE_PASSWORD: testpass
          SPRING_REDIS_HOST: localhost
          SPRING_REDIS_PORT: 6379
          # WHY SERVER_PORT explicit even in tests:
          # Kubernetes port injection bug applies in GitHub Actions too if
          # previous steps set service-named env vars. Explicit port is always safe.
          SERVER_PORT: ${{ matrix.port }}
        run: |
          mvn verify -P integration-test \
            -Dspring.profiles.active=integration-test \
            --no-transfer-progress

  # ─────────────────────────────────────────────────────────────────
  # JOB 4: Security Scan + Container Build + Push to ECR
  # ─────────────────────────────────────────────────────────────────
  security-scan-and-push:
    name: Security Scan + Push — ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [detect-changes, integration-test]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    strategy:
      matrix: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::371056712467:role/ComposePortalGitHubActionsRole
          aws-region: ap-south-1
          # WHY role-session-name: Appears in CloudTrail logs.
          # "GHA-deploy-user-service-abc123" tells you exactly which workflow
          # run made which AWS API call. Critical for security forensics.
          role-session-name: GHA-${{ matrix.service }}-${{ github.run_id }}

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Download JAR
        uses: actions/download-artifact@v4
        with:
          name: jar-${{ matrix.service }}-${{ github.sha }}
          path: services/${{ matrix.service }}/target/

      - name: Build Docker image
        id: build-image
        working-directory: services/${{ matrix.service }}
        env:
          IMAGE_URI: ${{ env.ECR_REGISTRY }}/compose-portal/${{ matrix.service }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # WHY --build-arg BUILD_DATE and GIT_COMMIT:
          # Bakes the commit hash and build time into the Docker image as labels.
          # In production: docker inspect <image> → shows exactly which git commit is running.
          # This is how you answer: "What version of user-service is in prod right now?"
          docker build \
            --build-arg BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ') \
            --build-arg GIT_COMMIT=${{ github.sha }} \
            --label "git.commit=${{ github.sha }}" \
            --label "git.branch=${{ github.ref_name }}" \
            --label "build.date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --cache-from ${IMAGE_URI}:latest \
            -t ${IMAGE_URI}:${IMAGE_TAG} \
            -t ${IMAGE_URI}:latest \
            .
          echo "image=${IMAGE_URI}:${IMAGE_TAG}" >> $GITHUB_OUTPUT

      - name: Scan with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.build-image.outputs.image }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          # WHY exit-code 1 for CRITICAL only:
          # CRITICAL CVEs block the pipeline — these are actively exploited vulnerabilities.
          # HIGH CVEs generate SARIF report (visible in GitHub Security tab) but don't block.
          # This is the enterprise balance: security without blocking every deployment.
          exit-code: 1
          vuln-type: os,library
          ignore-unfixed: true   # WHY: Don't fail on CVEs with no available fix yet.

      - name: Upload Trivy SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()   # Upload even if Trivy found issues (so they appear in Security tab)
        with:
          sarif_file: trivy-results.sarif

      - name: Push to ECR
        env:
          IMAGE_URI: ${{ env.ECR_REGISTRY }}/compose-portal/${{ matrix.service }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker push ${IMAGE_URI}:${IMAGE_TAG}
          docker push ${IMAGE_URI}:latest
          echo "✅ Pushed: ${IMAGE_URI}:${IMAGE_TAG}"

      - name: Update Helm values with new image tag
        env:
          IMAGE_TAG: ${{ github.sha }}
          SERVICE: ${{ matrix.service }}
        run: |
          # WHY update Helm values in Git (not patch Kubernetes directly):
          # ArgoCD watches Git as the source of truth.
          # If you kubectl set image directly, ArgoCD will revert it on next sync.
          # The correct GitOps flow: update the image tag in Git → ArgoCD detects →
          # ArgoCD applies the change. Git history IS your deployment history.
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "GitHub Actions"

          # Update the image tag in the Helm values file
          sed -i "s|tag: .*  # ${SERVICE}|tag: ${IMAGE_TAG}  # ${SERVICE}|g" \
            k8s/helm/compose-portal/values.yaml

          git add k8s/helm/compose-portal/values.yaml
          git diff --staged --quiet || git commit \
            -m "ci: update ${SERVICE} image to ${IMAGE_TAG} [skip ci]"
          # WHY [skip ci]: Prevents an infinite loop where the CI bot push triggers another CI run.

      - name: Push image tag commit
        uses: ad-m/github-push-action@v0.8.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref_name }}

  # ─────────────────────────────────────────────────────────────────
  # JOB 5: Deploy to Staging via ArgoCD
  # ─────────────────────────────────────────────────────────────────
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: security-scan-and-push
    environment: staging   # WHY environment: GitHub Environments provide audit log + optional approval

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::371056712467:role/ComposePortalGitHubActionsRole
          aws-region: ap-south-1
          role-session-name: GHA-staging-deploy-${{ github.run_id }}

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --name compose-portal-eks \
            --region ap-south-1

      - name: Install ArgoCD CLI
        run: |
          curl -sSL -o /usr/local/bin/argocd \
            https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64
          chmod +x /usr/local/bin/argocd

      - name: Trigger ArgoCD sync — staging
        run: |
          # WHY ArgoCD sync here instead of kubectl apply:
          # ArgoCD knows the desired state from Git AND the actual cluster state.
          # argocd app sync = "make cluster match Git right now, don't wait for poll interval"
          # ArgoCD also validates the sync succeeded — if health checks fail, it reports failure here.

          # Login using in-cluster service account token
          ARGOCD_TOKEN=$(kubectl create token argocd-ci-sa -n argocd --duration=5m)
          argocd login \
            --server argocd-server.argocd.svc.cluster.local \
            --auth-token "$ARGOCD_TOKEN" \
            --insecure \
            --grpc-web

          # Sync staging app
          argocd app sync compose-portal-staging \
            --timeout 300 \
            --health

          echo "✅ Staging sync complete"

      - name: Smoke test staging
        run: |
          STAGING_URL="https://staging.estateflowai.co"
          
          # Wait for pods to be ready
          kubectl wait --for=condition=ready pod \
            -l app.kubernetes.io/part-of=compose-portal \
            -n compose-portal-staging \
            --timeout=120s

          # Test each service health endpoint
          for svc in gateway user product order; do
            STATUS=$(curl -sf --retry 3 --retry-delay 5 \
              "${STAGING_URL}/api/${svc}/actuator/health" | jq -r '.status' 2>/dev/null || echo "DOWN")
            echo "${svc}-service: ${STATUS}"
            [[ "$STATUS" != "UP" ]] && echo "❌ ${svc}-service health check FAILED" && exit 1
          done
          
          echo "✅ All services healthy on staging"

  # ─────────────────────────────────────────────────────────────────
  # JOB 6: Deploy to Production (main branch only, requires approval)
  # ─────────────────────────────────────────────────────────────────
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.ref == 'refs/heads/main'
    # WHY environment with required reviewers:
    # GitHub Environments can require 1+ approvals before the job runs.
    # In GitHub repo settings: Settings → Environments → production → Required reviewers
    # This adds a human gate before production deployment.
    # ArgoCD has its own gate too (configured below with sync policy).
    environment:
      name: production
      url: https://app.estateflowai.co

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS + kubectl
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::371056712467:role/ComposePortalGitHubActionsRole
          aws-region: ap-south-1
          role-session-name: GHA-prod-deploy-${{ github.run_id }}

      - run: aws eks update-kubeconfig --name compose-portal-eks --region ap-south-1

      - name: ArgoCD sync — production
        run: |
          # Production sync uses --sync-policy (defined in ArgoCD app manifest)
          # ArgoCD ApplicationSet manages environment promotion automatically
          # after Git image tag update is detected.
          # Manual trigger here for immediate deploy after approval:
          ARGOCD_TOKEN=$(kubectl create token argocd-ci-sa -n argocd --duration=5m)
          argocd login \
            --server argocd-server.argocd.svc.cluster.local \
            --auth-token "$ARGOCD_TOKEN" \
            --insecure \
            --grpc-web
          
          argocd app sync compose-portal-prod \
            --timeout 600 \
            --health \
            --retry-limit 3

      - name: Post-deploy verification
        run: |
          PROD_URL="https://app.estateflowai.co"
          sleep 30   # Wait for rolling update to complete
          
          for svc in gateway user product order; do
            STATUS=$(curl -sf --retry 5 --retry-delay 10 \
              "${PROD_URL}/api/${svc}/actuator/health" | jq -r '.status' 2>/dev/null || echo "DOWN")
            [[ "$STATUS" != "UP" ]] && echo "❌ PRODUCTION ${svc} DOWN — initiating rollback" && \
              argocd app rollback compose-portal-prod && exit 1
            echo "✅ PRODUCTION ${svc}: ${STATUS}"
          done

      - name: Post deployment comment on PR
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const status = '${{ job.status }}' === 'success' ? '✅' : '❌';
            const msg = `${status} **Production Deploy** — \`${{ github.sha }}\`\n` +
              `Environment: https://app.estateflowai.co\n` +
              `Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`;
            github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: msg
            });