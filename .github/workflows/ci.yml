name: EstateFlow AI — CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: 371056712467.dkr.ecr.ap-south-1.amazonaws.com
  EKS_CLUSTER: compose-portal-dev-eks

permissions:
  id-token: write
  contents: write

jobs:
  detect-changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      any_changed: ${{ steps.set-matrix.outputs.any_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            gateway-service:
              - 'services/gateway-service/**'
            user-service:
              - 'services/user-service/**'
            product-service:
              - 'services/product-service/**'
            order-service:
              - 'services/order-service/**'
            frontend:
              - 'services/frontend/**'

      - name: Build matrix
        id: set-matrix
        run: |
          SERVICES=()
          PORTS=()
          [ "${{ steps.changes.outputs.gateway-service }}" = "true" ] && SERVICES+=("gateway-service") && PORTS+=("8080")
          [ "${{ steps.changes.outputs.user-service }}" = "true" ] && SERVICES+=("user-service") && PORTS+=("8081")
          [ "${{ steps.changes.outputs.product-service }}" = "true" ] && SERVICES+=("product-service") && PORTS+=("8082")
          [ "${{ steps.changes.outputs.order-service }}" = "true" ] && SERVICES+=("order-service") && PORTS+=("8083")
          [ "${{ steps.changes.outputs.frontend }}" = "true" ] && SERVICES+=("frontend") && PORTS+=("80")
          if [ ${#SERVICES[@]} -eq 0 ]; then
            echo "matrix={\"include\":[]}" >> $GITHUB_OUTPUT
            echo "any_changed=false" >> $GITHUB_OUTPUT
          else
            MATRIX="{\"include\":["
            for i in "${!SERVICES[@]}"; do
              [ $i -gt 0 ] && MATRIX+=","
              MATRIX+="{\"service\":\"${SERVICES[$i]}\",\"port\":\"${PORTS[$i]}\"}"
            done
            MATRIX+="]}"
            echo "matrix=$MATRIX" >> $GITHUB_OUTPUT
            echo "any_changed=true" >> $GITHUB_OUTPUT
          fi

  build-and-test:
    name: Build + Test — ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.any_changed == 'true'
    strategy:
      matrix: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        if: matrix.service != 'frontend'
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Setup Node.js
        if: matrix.service == 'frontend'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: services/frontend/package-lock.json

      - name: Secret scan (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Java service
        if: matrix.service != 'frontend'
        run: |
          mvn install -N --no-transfer-progress
          mvn clean package -DskipTests --no-transfer-progress -pl services/${{ matrix.service }}

      - name: Build Frontend
        if: matrix.service == 'frontend'
        run: |
          cd services/frontend
          npm ci
          npm run build

      - name: Upload JAR
        if: matrix.service != 'frontend'
        uses: actions/upload-artifact@v4
        with:
          name: jar-${{ matrix.service }}-${{ github.sha }}
          path: services/${{ matrix.service }}/target/*.jar
          retention-days: 1

  security-scan-and-push:
    name: Scan + Push — ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [detect-changes, build-and-test]
    if: needs.detect-changes.outputs.any_changed == 'true' && github.ref == 'refs/heads/main'
    strategy:
      matrix: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - name: Download JAR
        if: matrix.service != 'frontend'
        uses: actions/download-artifact@v4
        with:
          name: jar-${{ matrix.service }}-${{ github.sha }}
          path: services/${{ matrix.service }}/target/

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GHA-${{ matrix.service }}-${{ github.run_id }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Delete old ECR tag
        run: |
          DIGEST=$(aws ecr batch-get-image \
            --repository-name ${{ matrix.service }} \
            --image-ids imageTag=sha-${{ github.sha }} \
            --query 'images[0].imageId.imageDigest' \
            --output text --region ${{ env.AWS_REGION }} 2>/dev/null || echo "")
          if [ ! -z "$DIGEST" ] && [ "$DIGEST" != "None" ]; then
            aws ecr batch-delete-image \
              --repository-name ${{ matrix.service }} \
              --image-ids imageDigest=$DIGEST \
              --region ${{ env.AWS_REGION }} > /dev/null 2>&1 || true
          fi

      - name: Build Docker image
        run: |
          docker build \
            --no-cache \
            -f services/${{ matrix.service }}/Dockerfile \
            --build-context root-pom=. \
            --provenance=false \
            -t ${{ env.ECR_REGISTRY }}/${{ matrix.service }}:sha-${{ github.sha }} \
            services/${{ matrix.service }}/

      - name: Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.ECR_REGISTRY }}/${{ matrix.service }}:sha-${{ github.sha }}
          format: table
          exit-code: 0
          severity: CRITICAL,HIGH

      - name: Push to ECR
        run: |
          docker push ${{ env.ECR_REGISTRY }}/${{ matrix.service }}:sha-${{ github.sha }}

  update-gitops:
    name: Update GitOps Manifests
    runs-on: ubuntu-latest
    needs: [detect-changes, security-scan-and-push]
    if: needs.detect-changes.outputs.any_changed == 'true' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main

      - name: Update image tags in kustomization.yaml
        run: |
          IMAGE_TAG="sha-${{ github.sha }}"
          SERVICES=$(echo '${{ needs.detect-changes.outputs.matrix }}' | python3 -c "import json,sys; print(' '.join(i['service'] for i in json.load(sys.stdin)['include']))")
          echo "Updating services: $SERVICES to tag: $IMAGE_TAG"
          for SVC in $SERVICES; do
            # Match full ECR image name in kustomization.yaml
            sed -i "/${ECR_REGISTRY//\//\\/}\/${SVC}/{n;s/newTag: .*/newTag: ${IMAGE_TAG}/}" \
              k8s/overlays/dev/kustomization.yaml
          done
          grep "newTag" k8s/overlays/dev/kustomization.yaml

      - name: Commit and push
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "GitHub Actions"
          git fetch origin
          git reset --hard origin/main
          git add k8s/overlays/dev/kustomization.yaml
          git diff --staged --quiet || git commit -m "ci: update images to sha-${{ github.sha }} [skip ci]"
          git push

  argocd-sync:
    name: ArgoCD Sync
    runs-on: ubuntu-latest
    needs: update-gitops
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name ${{ env.EKS_CLUSTER }} \
            --region ${{ env.AWS_REGION }}

      - name: Trigger ArgoCD refresh and verify
        run: |
          kubectl annotate application compose-portal-dev \
            -n argocd \
            argocd.argoproj.io/refresh=hard --overwrite
          echo "ArgoCD refresh triggered"
          sleep 60
          kubectl get application compose-portal-dev -n argocd \
            -o jsonpath='{.status.health.status}' && echo ""
          kubectl get pods -n compose-portal --no-headers
