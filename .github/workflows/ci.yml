name: EstateFlow AI — CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: 371056712467.dkr.ecr.ap-south-1.amazonaws.com
  EKS_CLUSTER: compose-portal-dev-eks

permissions:
  id-token: write
  contents: write

jobs:
  detect-changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      any_changed: ${{ steps.set-matrix.outputs.any_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            gateway-service:
              - 'services/gateway-service/**'
            user-service:
              - 'services/user-service/**'
            product-service:
              - 'services/product-service/**'
            order-service:
              - 'services/order-service/**'

      - name: Build matrix
        id: set-matrix
        run: |
          SERVICES=()
          PORTS=()
          [ "${{ steps.changes.outputs.gateway-service }}" = "true" ] && \
            SERVICES+=("gateway-service") && PORTS+=("8080")
          [ "${{ steps.changes.outputs.user-service }}" = "true" ] && \
            SERVICES+=("user-service") && PORTS+=("8081")
          [ "${{ steps.changes.outputs.product-service }}" = "true" ] && \
            SERVICES+=("product-service") && PORTS+=("8082")
          [ "${{ steps.changes.outputs.order-service }}" = "true" ] && \
            SERVICES+=("order-service") && PORTS+=("8083")

          if [ ${#SERVICES[@]} -eq 0 ]; then
            echo "matrix={\"include\":[]}" >> $GITHUB_OUTPUT
            echo "any_changed=false" >> $GITHUB_OUTPUT
          else
            MATRIX="{\"include\":["
            for i in "${!SERVICES[@]}"; do
              [ $i -gt 0 ] && MATRIX+=","
              MATRIX+="{\"service\":\"${SERVICES[$i]}\",\"port\":\"${PORTS[$i]}\"}"
            done
            MATRIX+="]}"
            echo "matrix=$MATRIX" >> $GITHUB_OUTPUT
            echo "any_changed=true" >> $GITHUB_OUTPUT
          fi

  build-and-test:
    name: Build + Test — ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.any_changed == 'true'
    strategy:
      matrix: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Secret scan (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: |
          # Copy root pom.xml so Maven can resolve parent POM
          cp pom.xml services/${{ matrix.service }}/../pom.xml 2>/dev/null || true
          cd services/${{ matrix.service }}
          mvn clean package -DskipTests --no-transfer-progress

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: jar-${{ matrix.service }}-${{ github.sha }}
          path: services/${{ matrix.service }}/target/*.jar
          retention-days: 1

  security-scan-and-push:
    name: Scan + Push — ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [detect-changes, build-and-test]
    if: |
      needs.detect-changes.outputs.any_changed == 'true' &&
      github.ref == 'refs/heads/main'
    strategy:
      matrix: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - name: Download JAR
        uses: actions/download-artifact@v4
        with:
          name: jar-${{ matrix.service }}-${{ github.sha }}
          path: services/${{ matrix.service }}/target/

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GHA-${{ matrix.service }}-${{ github.run_id }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Delete old ECR tag
        run: |
          DIGEST=$(aws ecr batch-get-image \
            --repository-name ${{ matrix.service }} \
            --image-ids imageTag=sha-${{ github.sha }} \
            --query 'images[0].imageId.imageDigest' \
            --output text --region ${{ env.AWS_REGION }} 2>/dev/null || echo "")
          if [ ! -z "$DIGEST" ] && [ "$DIGEST" != "None" ]; then
            aws ecr batch-delete-image \
              --repository-name ${{ matrix.service }} \
              --image-ids imageDigest=$DIGEST \
              --region ${{ env.AWS_REGION }} > /dev/null 2>&1 || true
          fi

      - name: Build Docker image
        run: |
          docker build \
            -f services/${{ matrix.service }}/Dockerfile \
            --build-context root-pom=. \
            --provenance=false \
            -t ${{ env.ECR_REGISTRY }}/${{ matrix.service }}:sha-${{ github.sha }} \
            services/${{ matrix.service }}/

      - name: Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.ECR_REGISTRY }}/${{ matrix.service }}:sha-${{ github.sha }}
          format: table
          exit-code: 0
          severity: CRITICAL,HIGH

      - name: Push to ECR
        run: |
          docker push \
            ${{ env.ECR_REGISTRY }}/${{ matrix.service }}:sha-${{ github.sha }}

  update-gitops:
    name: Update GitOps Manifests
    runs-on: ubuntu-latest
    needs: [detect-changes, security-scan-and-push]
    if: |
      needs.detect-changes.outputs.any_changed == 'true' &&
      github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update image tags
        run: |
          IMAGE_TAG="sha-${{ github.sha }}"
          echo '${{ needs.detect-changes.outputs.matrix }}' | python3 -c "
import json, sys
import subprocess
data = json.load(sys.stdin)
services = [item['service'] for item in data.get('include', [])]
image_tag = '${IMAGE_TAG}'
with open('k8s/overlays/dev/kustomization.yaml', 'r') as f:
    lines = f.readlines()
result = []
i = 0
while i < len(lines):
    line = lines[i]
    result.append(line)
    if '- name:' in line:
        svc_name = line.strip().replace('- name:', '').strip()
        if svc_name in services:
            i += 1
            if i < len(lines) and 'newName:' in lines[i]:
                result.append(lines[i])
                i += 1
            if i < len(lines) and 'newTag:' in lines[i]:
                indent = len(lines[i]) - len(lines[i].lstrip())
                result.append(' ' * indent + 'newTag: ' + image_tag + '
')
                i += 1
                continue
    i += 1
with open('k8s/overlays/dev/kustomization.yaml', 'w') as f:
    f.writelines(result)
print('Updated services:', services)
          "

      - name: Commit and push
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "GitHub Actions"
          git add k8s/overlays/dev/kustomization.yaml
          git diff --staged --quiet || \
            git commit -m "ci: update images to sha-${{ github.sha }} [skip ci]"
          git push

  argocd-sync:
    name: ArgoCD Sync
    runs-on: ubuntu-latest
    needs: update-gitops
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name ${{ env.EKS_CLUSTER }} \
            --region ${{ env.AWS_REGION }}

      - name: Wait for ArgoCD self-sync
        run: |
          echo "ArgoCD detects Git change automatically (selfHeal: true)"
          echo "Waiting 60s for ArgoCD to detect and sync..."
          sleep 60
          kubectl get application compose-portal-dev -n argocd \
            -o jsonpath='{.status.sync.status}' && echo ""
          kubectl get application compose-portal-dev -n argocd \
            -o jsonpath='{.status.health.status}' && echo ""
          kubectl get pods -n compose-portal
