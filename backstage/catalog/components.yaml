apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: gateway-service
  title: Gateway Service
  description: Spring Cloud Gateway with Resilience4j circuit breaker, Redis rate limiting, CORS
  annotations:
    github.com/project-slug: nimmalabalagit/compose-portal-application
    backstage.io/techdocs-ref: dir:./services/gateway-service
    argocd/app-name: compose-portal-dev
    prometheus.io/rule: |
      - alert: GatewayCircuitOpen
        expr: resilience4j_circuitbreaker_state{state="open"} == 1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Gateway circuit breaker OPEN
  tags:
    - java
    - spring-boot
    - gateway
    - redis
  links:
    - url: https://api.estateflowai.co/actuator/health
      title: Health Check
    - url: https://grafana.estateflowai.co
      title: Grafana Dashboard
spec:
  type: service
  lifecycle: production
  owner: platform-team
  system: estateflowai
  providesApis:
    - estateflowai-api
  dependsOn:
    - component:user-service
    - component:product-service
    - component:order-service
    - resource:redis
---
