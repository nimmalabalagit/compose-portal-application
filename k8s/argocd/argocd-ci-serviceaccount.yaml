# k8s/argocd/argocd-ci-serviceaccount.yaml
# WHY a dedicated service account for CI:
# argocd admin credentials have cluster-wide power. Giving CI full admin access
# is a security risk — one leaked token = full cluster access.
# This service account can only: trigger syncs + read application status.
# Least privilege applied to CI/CD tooling.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: argocd-ci-sa
  namespace: argocd
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: argocd-ci-role
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: [""]
    resources: ["serviceaccounts/token"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: argocd-ci-binding
subjects:
  - kind: ServiceAccount
    name: argocd-ci-sa
    namespace: argocd
roleRef:
  kind: ClusterRole
  name: argocd-ci-role
  apiGroup: rbac.authorization.k8s.io