apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: gateway-service-secrets
  namespace: compose-portal
spec:
  refreshInterval: 1h    # Re-sync from SSM every hour (handles rotation)
  secretStoreRef:
    name: aws-parameter-store
    kind: ClusterSecretStore
  target:
    name: gateway-service-secrets    # Name of K8s Secret to create/update
    creationPolicy: Owner            # ESO owns this Secret lifecycle
  data:
    - secretKey: DB_URL              # Key in K8s Secret
      remoteRef:
        key: /compose-portal/gateway-service/db/url    # SSM Parameter path
    - secretKey: DB_USERNAME
      remoteRef:
        key: /compose-portal/gateway-service/db/username
    - secretKey: DB_PASSWORD
      remoteRef:
        key: /compose-portal/gateway-service/db/password
    - secretKey: REDIS_HOST
      remoteRef:
        key: /compose-portal/common/redis-host
    - secretKey: REDIS_PORT
      remoteRef:
        key: /compose-portal/common/redis-port