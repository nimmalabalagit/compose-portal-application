apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-parameter-store
spec:
  provider:
    aws:
      service: ParameterStore
      region: ap-south-1
      # ESO uses its own IRSA role to read SSM
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets-sa
            namespace: external-secrets
# WHY External Secrets Operator (ESO):
# ECS equivalent: task definition secrets: block (SSM injection at task start)
# K8s equivalent: ESO watches ExternalSecret CRDs → creates K8s Secrets from SSM
# Rotation: refreshInterval=1h → ESO re-reads SSM every hour, updates K8s Secret
# This is your interview answer for Problem 8 (secrets management in K8s).