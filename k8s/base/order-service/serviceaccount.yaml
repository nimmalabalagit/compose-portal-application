apiVersion: v1
kind: ServiceAccount
metadata:
  name: order-service-sa
  namespace: compose-portal
  annotations:
    # WHY this annotation:
    # This binds the K8s ServiceAccount to the AWS IAM Role.
    # When a pod uses this SA, EKS injects a JWT token at:
    #   /var/run/secrets/eks.amazonaws.com/serviceaccount/token
    # AWS SDK reads this token → calls STS AssumeRoleWithWebIdentity
    # → gets temporary credentials with ONLY the permissions in this role.
    # No static keys. No EC2 metadata abuse. This is the EKS credential model.
    # Oracle analogy: IRSA = Oracle Wallet auto-login (cwallet.sso).
    # Credential-free auth via pre-established federation.
    # This is your interview answer for Problem 3 (IRSA vs ECS Task Role).
    eks.amazonaws.com/role-arn: >
      arn:aws:iam::371056712467:role/compose-portal-order-irsa-prod