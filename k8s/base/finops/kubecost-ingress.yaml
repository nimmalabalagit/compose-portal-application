# k8s/base/finops/kubecost-ingress.yaml
# Expose Kubecost UI via internal ALB
# Access: http://kubecost.internal.estateflowai.co
#
# INTERVIEW: Kubecost shows:
#   - Cost per namespace (compose-portal, observability, argocd)
#   - Cost per deployment (order-service $0.83/day)
#   - Cost per label (team=platform, env=dev)
#   - Idle resource cost (pods requesting 4 CPU but using 0.1)
#   - Spot vs On-Demand savings from Karpenter
#
# Unit economics calculation:
#   Total compose-portal namespace cost = $8/day
#   Total API requests/day = 26.4 RPS x 86400s = 2,280,960 requests
#   Cost per request = $8 / 2,280,960 = $0.0000035 per request
#   Cost per 1000 requests = $0.0035

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kubecost-ingress
  namespace: kubecost
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internal
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /healthz
spec:
  rules:
    - host: kubecost.internal.estateflowai.co
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kubecost-cost-analyzer
                port:
                  number: 9090
