apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  # Dev: 1 replica (save cost)
  - target:
      kind: Deployment
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1

  # Dev: smaller resources
  - target:
      kind: Deployment
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "100m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "256Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "500m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "512Mi"

  # Dev: HPA min=1 (allow scale to zero effectively)
  - target:
      kind: HorizontalPodAutoscaler
    patch: |
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 3

  # Dev: faster ESO refresh
  - target:
      kind: ExternalSecret
    patch: |
      - op: replace
        path: /spec/refreshInterval
        value: "5m"

images:
  - name: gateway-service
    newTag: dev-latest
  - name: user-service
    newTag: dev-latest
  - name: product-service
    newTag: dev-latest
  - name: order-service
    newTag: dev-latest
