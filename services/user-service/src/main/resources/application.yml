server:
  port: ${SERVER_PORT:8081}  # Explicit — prevents K8s env var injection collision

spring:
  application:
    name: user-service

  datasource:
    # WHY HikariCP (Spring Boot default):
    # Connection creation takes ~50ms. HikariCP keeps 10 warm connections.
    # Each request borrows one in ~0.3ms, uses it, returns it.
    # maximumPoolSize=10: K8s HPA can scale replicas, but pool×replicas×services
    # must stay under Aurora max_connections=1708.
    # At 34 replicas × 4 services × 10 pool = 1360 connections (safe at 80%).
    url: ${DB_URL:jdbc:postgresql://localhost:5432/users_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:localdev123}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      leak-detection-threshold: 0  # Warn if connection held >60s

  jpa:
    hibernate:
      ddl-auto: validate      # Flyway owns schema — JPA only validates
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 50      # Batch 50 inserts in 1 round-trip

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  cache:
    type: redis

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus,info
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

  mvc:
    cors:
      mappings:
        "[/api/**]":
          allowed-origins: "*"
          allowed-methods: "GET,POST,PUT,PATCH,DELETE,OPTIONS"
          allowed-headers: "*"
---
spring:
  config:
    activate:
      on-profile: k8s
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
  cache:
    type: redis
