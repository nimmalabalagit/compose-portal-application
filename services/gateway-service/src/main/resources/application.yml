server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: gateway-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:5173"
              - "http://localhost:3000"
              - "https://www.estateflowai.co"
              - "https://api.estateflowai.co"
            allowedMethods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
            allowedHeaders: ["*"]
            allowCredentials: true
            maxAge: 3600
      routes:
        - id: user-service
          uri: ${USER_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/users/**
          filters:
            - RemoveRequestHeader=Transfer-Encoding
            - name: CircuitBreaker
              args:
                name: user-service-cb
                fallbackUri: forward:/fallback/user-service

        - id: product-service
          uri: ${PRODUCT_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/products/**
          filters:
            - RemoveRequestHeader=Transfer-Encoding
            - name: CircuitBreaker
              args:
                name: product-service-cb
                fallbackUri: forward:/fallback/product-service

        - id: order-service
          uri: ${ORDER_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/orders/**
          filters:
            - RemoveRequestHeader=Transfer-Encoding
            - name: CircuitBreaker
              args:
                name: order-service-cb
                fallbackUri: forward:/fallback/order-service

resilience4j:
  circuitbreaker:
    instances:
      user-service-cb:
        slidingWindowSize: 20
        failureRateThreshold: 60
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 5
        slidingWindowType: COUNT_BASED
        minimumNumberOfCalls: 10
      product-service-cb:
        slidingWindowSize: 20
        failureRateThreshold: 60
        waitDurationInOpenState: 10s
        minimumNumberOfCalls: 10
      order-service-cb:
        slidingWindowSize: 20
        failureRateThreshold: 60
        waitDurationInOpenState: 10s
        minimumNumberOfCalls: 10

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus,info
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  metrics:
    tags:
      service: gateway-service
      region: ap-south-1
---
spring:
  config:
    activate:
      on-profile: k8s
  data:
    redis:
      host: ${REDIS_HOST:redis.compose-portal.svc.cluster.local}
      port: ${REDIS_PORT:6379}
