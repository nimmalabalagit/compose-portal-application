server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # WHY gzip: React bundle ~800KB → ~200KB compressed. 4x faster load.
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml text/javascript;
    gzip_comp_level 6;
    gzip_min_length 1000;

    # WHY try_files: React Router handles routing in JS.
    # /products/123 is not a real file — nginx returns index.html
    # and React Router parses the URL client-side.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # WHY 1-year cache for /assets/: Vite generates content-hash filenames.
    # main.a1b2c3.js — content changes → filename changes → cache invalidated automatically.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Health check endpoint for Docker/K8s
    location /health {
        return 200 'healthy\n';
        add_header Content-Type text/plain;
    }

    # Security headers
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
